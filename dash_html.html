<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Boat Fund</title>
<style>
  :root{
    --abyss:#06171f;      /* night sky over water */
    --deep:#0b3346;       /* deep sea */
    --sea:#15697f;        /* mid sea */
    --shallow:#2f9fb0;    /* crest */
    --foam:#eaf3f2;       /* type on dark / foam */
    --brass:#e8b24c;      /* lamp / destination */
    --brass-dim:#a87e2e;
    --muted:#7fa6b1;      /* dim label */
    --pad: clamp(16px, 3vw, 48px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--abyss);
    color:var(--foam);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .bgvideo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:saturate(1.1)}
  .bgoverlay{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:linear-gradient(180deg, rgba(6,23,31,.12), rgba(6,23,31,.1) 40%, rgba(6,23,31,.4))}
  .stage{position:fixed;inset:0;display:flex;flex-direction:column}

  /* ---- eyebrow / header ---- */
  .top{
    position:relative;z-index:5;
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:var(--pad) var(--pad) 0;
  }
  .eyebrow{font-size:clamp(10px,1vw,13px);letter-spacing:.42em;text-transform:uppercase;color:var(--brass);font-weight:700}
  .sub{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-style:normal;color:var(--foam);
    font-size:clamp(30px,4.6vw,68px);line-height:1.05;letter-spacing:-.01em;margin-top:.15em;
    text-shadow:0 4px 30px rgba(0,0,0,.6), 0 1px 0 rgba(0,0,0,.4);max-width:16ch}
  /* ---- views ---- */
  .views{position:relative;flex:1;min-height:0}
  .view{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease;pointer-events:none}
  .view.active{opacity:1;pointer-events:auto}

  /* ---- TIDE (hero) ---- */
  .readout{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:flex-start;
    justify-content:center;text-align:left;gap:clamp(18px,3vh,36px);padding-left:var(--pad)}
  .figure .k{font-size:clamp(10px,.95vw,13px);letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:.2em}
  .pct{font-size:clamp(56px,11vw,160px);font-weight:800;line-height:.9;letter-spacing:-.03em;text-shadow:0 4px 40px rgba(0,0,0,.55)}
  .pct span{font-size:.4em;font-weight:600;color:var(--brass);margin-left:.05em}
  .figure-time .pct{font-size:clamp(32px,6vw,84px)}
  .money{font-size:clamp(16px,2vw,28px);font-weight:600;margin-top:.3em;text-shadow:0 2px 16px rgba(0,0,0,.5)}
  .money b{color:var(--foam)}
  .money .of{color:var(--muted);font-weight:500}
  .money .tgt{color:var(--brass)}

  /* ---- stats band ---- */
  .band{position:relative;z-index:5;display:flex;gap:clamp(12px,2.5vw,56px);
    padding:10px var(--pad) var(--pad);flex-wrap:wrap;background:rgba(6,23,31,.55)}
  .stat{display:flex;flex-direction:column}
  .stat .k{font-size:clamp(10px,.95vw,13px);letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .stat .v{font-size:clamp(20px,2.5vw,40px);font-weight:700;margin-top:.15em;font-variant-numeric:tabular-nums}
  .stat .v.brass{color:var(--brass)}
  .stat .v .small{font-size:.55em;font-weight:600;color:var(--muted)}

  .empty{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
  .empty p{font-family:Georgia,serif;font-style:italic;color:var(--muted);font-size:clamp(16px,2vw,26px)}

  /* ---- ROUTE (second page, full-bleed) ---- */
  #viewRoute{background:var(--abyss)}
  #routeSvg{display:block;width:100%;height:100%}
  .routeHead{position:absolute;top:var(--pad);left:var(--pad);z-index:2;
    display:flex;align-items:baseline;gap:.7em;pointer-events:none}
  .routeHead h2{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:normal;
    color:var(--foam);font-size:clamp(14px,1.6vw,22px);
    text-shadow:0 2px 16px rgba(6,23,31,.9)}
  .routeHead .eyebrow{text-shadow:0 2px 16px rgba(6,23,31,.9)}
</style>
</head>
<body>
<video class="bgvideo" autoplay muted loop playsinline preload="auto">
  <source src="video.mp4" type="video/mp4">
</video>
<div class="bgoverlay"></div>
<div class="stage">
  <div class="top">
    <div>
      <div class="eyebrow">The Boat Fund</div>
      <div class="sub" id="subtitle">Mediterranean liveaboard</div>
    </div>
  </div>

  <div class="views" id="views">
    <!-- TIDE -->
    <section class="view active" id="viewTide">
      <div class="readout" id="readout">
        <div class="figure figure-save">
          <div class="k">Saved</div>
          <div class="pct" id="pct">0<span>%</span></div>
          <div class="money"><b id="saved">£0</b> <span class="of">of</span> <span class="tgt" id="target">£72,500</span></div>
        </div>
        <div class="figure figure-time">
          <div class="k">Time to departure</div>
          <div class="pct" id="timePct">0<span>%</span></div>
          <div class="money"><b id="monthsElapsed">0</b> <span class="of">of</span> <span class="tgt" id="monthsTotal">0</span> months</div>
        </div>
      </div>
      <div class="empty" id="empty" style="display:none">
        <p>Every voyage starts at the dock.<br>Add a month's savings to config.js to set sail.</p>
      </div>
    </section>

    <!-- ROUTE -->
    <section class="view" id="viewRoute">
      <svg id="routeSvg"></svg>
      <div class="routeHead">
        <span class="eyebrow">The route</span>
        <h2>Mediterranean to the Cook Islands — a four-year passage</h2>
      </div>
    </section>
  </div>

  <div class="band" id="band">
    <!-- Hidden until the regular savings routine is underway; misleading with sparse data.
    <div class="stat"><div class="k">This month</div><div class="v" id="sThis">£0</div></div>
    <div class="stat"><div class="k">Monthly average</div><div class="v" id="sAvg">£0</div></div>
    <div class="stat"><div class="k">On course for</div><div class="v brass" id="sEta">—</div></div>
    -->
    <div class="stat"><div class="k">Target date</div><div class="v" id="sTgtDate">—</div></div>
  </div>
</div>

<script src="config.js"></script>
<script src="vendor/d3.v7.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="vendor/land-110m.js"></script>
<script src="route-data.js"></script>
<script src="route-map.js"></script>
<script>
(function(){
  "use strict";
  // All data comes from config.js — there is no in-page editor or browser storage.
  var state = Object.assign({
    target: 72500,
    startBalance: 0,
    planStart: ym(new Date()),
    targetDate: addMonths(ym(new Date()), 30),
    subtitle: "Mediterranean liveaboard",
    entries: []   // [{ym:"2026-08", amount:1642}]
  }, window.BOAT_CONFIG || {});

  function ym(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
  function addMonths(s, n){ var p=s.split("-"); var d=new Date(+p[0], +p[1]-1+n, 1); return ym(d); }
  function monthsBetween(a,b){ var pa=a.split("-"),pb=b.split("-"); return (+pb[0]-+pa[0])*12 + (+pb[1]-+pa[1]); }
  function fmtGBP(n){ return "£"+Math.round(n).toLocaleString("en-GB"); }
  function prettyMonth(s){ var p=s.split("-"); return new Date(+p[0],+p[1]-1,1).toLocaleDateString("en-GB",{month:"short",year:"numeric"}); }

  function derived(){
    var sorted = state.entries.slice().sort(function(a,b){ return a.ym<b.ym?-1:1; });
    var sum = sorted.reduce(function(t,e){ return t+(+e.amount||0); },0);
    var total = (+state.startBalance||0) + sum;
    var pct = state.target>0 ? Math.min(100, total/state.target*100) : 0;
    var thisM = ym(new Date());
    var thisEntry = sorted.filter(function(e){ return e.ym===thisM; }).reduce(function(t,e){ return t+(+e.amount||0); },0);
    var avg = sorted.length ? sum/sorted.length : 0;
    var remaining = Math.max(0, state.target-total);
    var eta = null;
    if(avg>0 && remaining>0){ eta = addMonths(thisM, Math.ceil(remaining/avg)); }
    else if(remaining<=0){ eta = "Arrived"; }

    // same bounded-percentage approach as the savings pct, applied to time.
    // 1-indexed: the plan's start month counts as month 1, not month 0.
    var totalMonths = Math.max(1, monthsBetween(state.planStart, state.targetDate) + 1);
    var elapsedMonths = Math.min(totalMonths, Math.max(1, monthsBetween(state.planStart, thisM) + 1));
    var timePct = Math.min(100, elapsedMonths/totalMonths*100);

    return {sorted:sorted, total:total, pct:pct, thisEntry:thisEntry, avg:avg, remaining:remaining, eta:eta,
      totalMonths:totalMonths, elapsedMonths:elapsedMonths, timePct:timePct};
  }

  function render(){
    var d = derived();
    var hasData = d.sorted.length>0 || state.startBalance>0;

    document.getElementById("subtitle").textContent = state.subtitle;
    document.getElementById("target").textContent = fmtGBP(state.target);
    document.getElementById("saved").textContent = fmtGBP(d.total);
    document.getElementById("pct").innerHTML = Math.round(d.pct)+"<span>%</span>";

    document.getElementById("timePct").innerHTML = Math.round(d.timePct)+"<span>%</span>";
    document.getElementById("monthsElapsed").textContent = d.elapsedMonths;
    document.getElementById("monthsTotal").textContent = d.totalMonths;

    document.getElementById("empty").style.display = hasData ? "none" : "flex";
    document.getElementById("readout").style.opacity = hasData ? "1" : "0";

    document.getElementById("sTgtDate").textContent = prettyMonth(state.targetDate);
    // "This month" / "Monthly average" / "On course for" stats are hidden (see
    // the commented-out .band markup above) until the savings routine settles in.
  }

  // ---- page rotation: dashboard <-> route map, every 60s ----
  // The route page is a full-bleed page in its own right, so the persistent
  // top branding bar and stats footer hide while it's showing.
  var views = [document.getElementById("viewTide"), document.getElementById("viewRoute")];
  var chrome = [document.querySelector(".top"), document.getElementById("band")];
  var activeView = 0;
  function showView(i){
    activeView = i;
    views.forEach(function(el, idx){ el.classList.toggle("active", idx === i); });
    chrome.forEach(function(el){ el.style.display = i === 1 ? "none" : ""; });
    if(i === 1 && window.drawRouteMap) window.drawRouteMap("#routeSvg", {});
  }
  setInterval(function(){ showView(activeView === 0 ? 1 : 0); }, 60000);

  // ---- wire up ----
  // double-tap anywhere on the readout toggles fullscreen (handy when mirroring)
  document.getElementById("views").addEventListener("dblclick",function(){
    if(!document.fullscreenElement){ (document.documentElement.requestFullscreen||function(){})(); }
    else if(document.exitFullscreen){ document.exitFullscreen(); }
  });
  window.addEventListener("resize", function(){
    if(activeView === 1 && window.drawRouteMap) window.drawRouteMap("#routeSvg", {});
  });

  render();
})();
</script>
</body>
</html>
