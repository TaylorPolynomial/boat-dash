<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mediterranean to the Cook Islands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --abyss:#06171f;
    --deep:#0b3346;
    --sea:#15697f;
    --land:#1b2b33;
    --land-edge:#2c4650;
    --brass:#e8b24c;
    --foam:#eaf3f2;
    --muted:#7fa6b1;
    --pad: clamp(20px, 3vw, 56px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--abyss);
    color:var(--foam);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    overflow:hidden;
  }
  .mapWrap{position:fixed;inset:0}
  svg{display:block;width:100%;height:100%}

  .page{position:fixed;inset:0;display:flex;flex-direction:column;padding:var(--pad);pointer-events:none}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
  h1{
    font-family:'Fraunces',Georgia,"Times New Roman",serif;
    font-weight:600;font-style:italic;
    font-size:clamp(22px,2.6vw,38px);
    line-height:1.15;color:var(--foam);
    max-width:46ch;
    text-shadow:0 2px 20px rgba(6,23,31,.9), 0 1px 0 rgba(6,23,31,.9);
  }
  .subtitle{color:var(--muted);font-size:clamp(12px,1.1vw,15px);margin-top:.4em;letter-spacing:.02em;
    text-shadow:0 2px 12px rgba(6,23,31,.9)}
  .exportBtn{
    background:rgba(6,23,31,.6);border:1px solid rgba(234,243,242,.25);color:var(--muted);
    border-radius:9px;padding:9px 16px;font-size:13px;font-family:inherit;cursor:pointer;
    white-space:nowrap;transition:opacity .2s,color .2s,border-color .2s;
    pointer-events:auto;
  }
  .exportBtn:hover{color:var(--foam);border-color:rgba(234,243,242,.5)}
  .exportRow{display:none;gap:10px;flex:none}
  .legend{
    display:flex;gap:clamp(20px,3vw,40px);align-items:center;flex-wrap:wrap;
    margin-top:auto;
  }
  .legendItem{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);
    text-shadow:0 2px 10px rgba(6,23,31,.9)}
  .swatchLine{width:28px;height:2.5px;background:var(--brass);border-radius:2px;flex:none}
  .swatchHalo{width:16px;height:16px;border-radius:50%;background:var(--brass);opacity:.35;flex:none}
</style>
</head>
<body>
<div class="mapWrap">
  <svg id="routeSvg"></svg>
</div>
<div class="page">
  <div class="head">
    <div>
      <h1>Mediterranean to the Cook Islands — a four-year passage.</h1>
      <div class="subtitle">Balearics · Atlantic · Caribbean · Panama · Pacific · Cook Islands</div>
    </div>
    <div class="exportRow">
      <button class="exportBtn" id="exportSvgBtn">Download SVG</button>
      <button class="exportBtn" id="exportBtn">Download PNG</button>
    </div>
  </div>
  <div class="legend">
    <div class="legendItem"><span class="swatchLine"></span> Passage</div>
    <div class="legendItem"><span class="swatchHalo"></span> Seasonal hold</div>
  </div>
</div>

<script src="vendor/d3.v7.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="vendor/land-110m.js"></script>
<script src="route-data.js"></script>
<script src="route-map.js"></script>
<script>
(function(){
  "use strict";
  function render(){ window.drawRouteMap("#routeSvg", {padding: 100}); }
  render();
  window.addEventListener("resize", render);

  document.getElementById("exportSvgBtn").addEventListener("click", function(){
    var svg = document.getElementById("routeSvg");
    var clone = svg.cloneNode(true);
    clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    var xml = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone);
    var blob = new Blob([xml], {type: "image/svg+xml;charset=utf-8"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "med-to-cook-islands-route.svg";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });

  document.getElementById("exportBtn").addEventListener("click", function(){
    var svg = document.getElementById("routeSvg");
    var rect = svg.getBoundingClientRect();
    var scale = 2; // ~2x for a crisp print/wall-display export
    var xml = new XMLSerializer().serializeToString(svg);
    var svgBlob = new Blob([xml], {type: "image/svg+xml;charset=utf-8"});
    var url = URL.createObjectURL(svgBlob);
    var img = new Image();
    img.onload = function(){
      var canvas = document.createElement("canvas");
      canvas.width = rect.width * scale;
      canvas.height = rect.height * scale;
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--abyss").trim() || "#06171f";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      canvas.toBlob(function(blob){
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "med-to-cook-islands-route.png";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }, "image/png");
    };
    img.src = url;
  });
})();
</script>
</body>
</html>
